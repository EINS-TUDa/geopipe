[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geopipe"
version = "0.0.1"
description = "Geographical energy system modelling data pipeline"
authors = [
    {name = "Carolin Ayasse", email = "carolin.ayasse@eins.tu-darmstadt.de"},
    {name = "Alexander Christ"},
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "energy system modelling",
    "gis",
    "optimisation",
    "district heating",
    "data pipeline",
]
dependencies = [
    "contextily>=1.7.0",
    "geopandas>=1.0.1",
    "matplotlib>=3.10.3",
    "networkx>=3.0",
    "numpy>=2.2.5",
    "openpyxl>=3.1.5",
    "osm2geojson>=0.3.1",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.3",
    "shapely>=2.1.0",
    "sqlalchemy>=2.0.44",
]

[project.optional-dependencies]
cesm = ["gurobipy<13.0", "plotly>=6.0"]
pypsa = ["pypsa>=1.3"]

[project.urls]
Homepage = "https://github.com/EINS-TUDa/geopipe"
Documentation = "https://eins-tuda.github.io/geopipe/"
Repository = "https://github.com/EINS-TUDa/geopipe"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
]
# Dependency groups are never published, so a direct reference is allowed
# here even though PyPI forbids one in [project.optional-dependencies].
cesm-dev = [
    "cesm @ git+https://github.com/EINS-TUDa/CESM.git@578e0bb",
    "gurobipy<13.0",
]

[tool.uv]
default-groups = ["dev", "docs", "cesm-dev"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/", "docs/",  ".env"]

[tool.pytest.ini_options]
python_functions = ["test_*", "*_test"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
