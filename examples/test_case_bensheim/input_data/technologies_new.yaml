# New categorized technology catalog (migration step a).
#
# Sections map technology names to their Type-class fields. The section
# determines which *Type* class is built. Fields that don't belong to the
# chosen Type are rejected. No naming-heuristic magic — commodity_in /
# commodity_out must be declared explicitly.
#
# Sections: decentralized, central, chp, grids, pipes

decentralized:

  ind_heat_pump:
    commodity_in: electricity
    commodity_out: residential_heat
    efficiency: 3.9
    technical_lifetime: 18
    opex_cost_energy: 0     # EUR/MWh
    opex_cost_power: 13       # EUR/kW
    capex_cost_power: 5000      # EUR/kW
    existing_capacity_phase_out_years: 20

  ind_gas_boiler:
    commodity_in: gas
    commodity_out: residential_heat
    efficiency: 0.94
    technical_lifetime: 20
    opex_cost_energy: 0
    opex_cost_power: 5
    capex_cost_power: 1620
    existing_capacity_phase_out_years: 10 # Years from model start by which existing_capacity has decreased linearly to 0.

  ind_oil_boiler:
    commodity_in: oil
    commodity_out: residential_heat
    efficiency: 0.925
    technical_lifetime: 20
    opex_cost_energy: 0
    opex_cost_power: 6
    capex_cost_power: 700
    existing_capacity_phase_out_years: 10

  ind_biomass:
    commodity_in: biomass
    commodity_out: residential_heat
    efficiency: 0.99
    technical_lifetime: 25
    opex_cost_energy: 0
    opex_cost_power: 1
    capex_cost_power: 1500
    existing_capacity_phase_out_years: 15

  heat_exchanger:
    commodity_in: district_heat_out
    commodity_out: residential_heat
    efficiency: 0.99
    technical_lifetime: 25
    opex_cost_energy: 0
    opex_cost_power: 1
    capex_cost_power: 1930
    existing_capacity_phase_out_years: 15


central:

  cen_heat_pump:
    commodity_in: electricity
    commodity_out: district_heat_in
    efficiency: 3.1
    technical_lifetime: 25
    opex_cost_energy: 0 # EUR/MWh
    opex_cost_power: 15 # EUR/kW
    capex_cost_power: 586 # EUR/kW
    capex_cost_base: 125000 # EUR

  cen_gas_boiler:
    commodity_in: gas
    commodity_out: district_heat_in
    efficiency: 0.99
    technical_lifetime: 25
    opex_cost_energy: 0
    opex_cost_power: 2
    capex_cost_power: 107
    capex_cost_base: 5400
    existing_capacity_retirement_years: 20

  cen_waste_heat_langnese:
    commodity_in: Dummy
    commodity_out: district_heat_in
    efficiency: 1
    technical_lifetime: 25
    opex_cost_energy: 10
    opex_cost_power: 1
    capex_cost_power: 440
    capex_cost_base: 260000
    max_capacity_per_year_per_unit: 400 # kW # per unit, can also be year dependent dict. Year is relative to start year (0 is first year of modeling period)
    max_units: 1 # Number of units that can be built, can also be year dependent dict
    existing_capacity_retirement_years: 15
    constrain_location_to_streets:
      - DEHE04620001hKzc # Street segment IDs where this technology can be located. If not given, can be located anywhere.

chp:

  chp_gas:
    commodity_in: gas
    commodity_out: district_heat_in
    commodity_out_2: electricity
    efficiency: 0.4
    loss: 0.1
    technical_lifetime: 25
    opex_cost_energy: 0
    opex_cost_power: 2
    capex_cost_power: 500
    capex_cost_base: 260000
    existing_capacity_retirement_years: 20


grids:

  heat_grid:
    commodity_in: district_heat_in
    commodity_out: district_heat_out
    efficiency: 0.86
    technical_lifetime: 40
    capex_per_km: 1000000        # EUR/km
    existing_capacity_retirement_years: 30 # Years from model start at which existing_capacity drops abruptly to 0



pipes:

  heat_pipe:
    commodity_in: district_heat_out
    commodity_out: district_heat_in
    efficiency: 0.96
    technical_lifetime: 40
    capex_per_km: 1000000        # EUR/km
    distance_threshold_m: 50
    existing_capacity_retirement_years: 30 # Years from model start at which existing_capacity drops abruptly to 0.