# New categorized technology catalog (migration step a).
#
# Sections map technology names to their Type-class fields. The section
# determines which *Type* class is built. Fields that don't belong to the
# chosen Type are rejected. No naming-heuristic magic — commodity_in /
# commodity_out must be declared explicitly.
#
# Sections: decentralized, central, chp, grids, pipes

decentralized:

  ind_heat_pump:
    commodity_in: electricity
    commodity_out: residential_heat
    efficiency: 3.9
    technical_lifetime: 18
    opex_cost_energy: 0     # EUR/MWh
    opex_cost_power: 13       # EUR/kW
    capex_cost_power: 5000      # EUR/kW

  ind_gas_boiler:
    commodity_in: gas
    commodity_out: residential_heat
    efficiency: 0.94
    technical_lifetime: 20
    opex_cost_energy: 0
    opex_cost_power: 5
    capex_cost_power: 1620
    existing_capacity_phase_out_years: 10 # Years from model start by which existing_capacity has decreased linearly to 0.

  ind_oil_boiler:
    commodity_in: oil
    commodity_out: residential_heat
    efficiency: 0.925
    technical_lifetime: 20
    opex_cost_energy: 0
    opex_cost_power: 6
    capex_cost_power: 700

  ind_hydrogen_boiler:
    commodity_in: hydrogen
    commodity_out: residential_heat
    efficiency: 0.95
    technical_lifetime: 20
    opex_cost_energy: 0
    opex_cost_power: 177
    capex_cost_power: 5000

  heat_exchanger:
    commodity_in: district_heat_out
    commodity_out: residential_heat
    efficiency: 0.99
    technical_lifetime: 25
    opex_cost_energy: 0
    opex_cost_power: 1
    capex_cost_power: 1930
    existing_capacity_phase_out_years: 15


