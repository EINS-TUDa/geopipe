# New categorized technology catalog (migration step a).
#
# Sections map technology names to their Type-class fields. The section
# determines which *Type* class is built. Fields that don't belong to the
# chosen Type are rejected. No naming-heuristic magic — commodity_in /
# commodity_out must be declared explicitly.
#
# Sections: decentralized, central, chp, grids, pipes

decentralized:

  ind_heat_pump:
    commodity_in: electricity
    commodity_out: residential_heat
    efficiency: 3.9
    technical_lifetime: 18
    opex_cost_energy: 0
    opex_cost_power: 13000       # EUR/MW
    capex_cost_power: 10100      # EUR/MWh

  ind_gas_boiler:
    commodity_in: gas
    commodity_out: residential_heat
    efficiency: 0.94
    technical_lifetime: 20
    opex_cost_energy: 0
