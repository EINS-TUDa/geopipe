# this is needed since cesm does not have the tools to decide how many units it actually needs 
# and otherwise by default uses aggregates.
# there is a base cost o every unit, the optimal choce depends on that cost per unit.
stages:
  stage1:
    max_units: 100000
  stage3:
    max_units: 50